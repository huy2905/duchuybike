<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle with shadow -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" />

  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3" />

  <!-- Bicycle Graphic in Center (Safe Zone) -->
  <g transform="translate(64, 96)" filter="url(#shadow)">
    <!-- Rear Wheel -->
    <circle cx="64" cy="220" r="56" fill="none" stroke="#ffffff" stroke-width="16" />
    <circle cx="64" cy="220" r="16" fill="#38bdf8" />

    <!-- Front Wheel -->
    <circle cx="320" cy="220" r="56" fill="none" stroke="#ffffff" stroke-width="16" />
    <circle cx="320" cy="220" r="16" fill="#38bdf8" />

    <!-- Chainring / Crank center -->
    <circle cx="170" cy="220" r="22" fill="#ffffff" />
    <circle cx="170" cy="220" r="10" fill="#1d4ed8" />

    <!-- Bike Frame Geometry (Sport Racing Frame) -->
    <!-- Chainstay: rear hub to crank -->
    <line x1="64" y1="220" x2="170" y2="220" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Seatstay: rear hub to seat cluster -->
    <line x1="64" y1="220" x2="150" y2="110" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Seat tube: crank to seat cluster -->
    <line x1="170" y1="220" x2="150" y2="110" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Seatpost & Saddle -->
    <line x1="150" y1="110" x2="144" y2="80" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <path d="M115,76 Q145,68 175,76 Q180,82 170,84 L120,84 Z" fill="#38bdf8" />

    <!-- Down tube: crank to head tube -->
    <line x1="170" y1="220" x2="270" y2="100" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <!-- Top tube: seat cluster to head tube -->
    <line x1="150" y1="110" x2="270" y2="100" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Head tube & Fork -->
    <line x1="270" y1="100" x2="320" y2="220" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <!-- Stem & Drop Handlebars -->
    <line x1="270" y1="100" x2="280" y2="65" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <path d="M280,65 L305,65 Q325,65 320,95 Q315,115 295,115" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

    <!-- Speed Accent Streak -->
    <path d="M30,130 L110,130" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 10" opacity="0.8" />
  </g>

  <!-- Typography: ĐỨC HUY -->
  <text x="256" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    ĐỨC HUY BIKE
  </text>
</svg>
